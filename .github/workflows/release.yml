name: Release

# Push a version tag (e.g. `git tag v2.2.0 && git push origin v2.2.0`) to build the app for
# Windows, macOS and Linux and publish a GitHub release with all three downloads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # manual run: builds the artifacts without publishing a release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: AI_Model_Autotuner-windows-x64.exe
          - os: macos-latest            # Apple Silicon
            asset: AI_Model_Autotuner-macos-arm64.zip
          - os: ubuntu-22.04            # older glibc = runs on more distributions
            asset: AI_Model_Autotuner-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      # Optional code-signing secrets (Settings → Secrets and variables → Actions).
      # Without them the builds are published unsigned.
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Keep build unsigned when no certificate is configured
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 == ''
        run: echo "MACOS_CODESIGN_IDENTITY=" >> "$GITHUB_ENV"

      - name: Build
        run: python build.py

      - name: Sign Windows executable
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\AI_Model_Autotuner.exe
          Remove-Item cert.pfx

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist\AI_Model_Autotuner.exe "dist\${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p pkg/"LLM Autotuner"
          cp dist/AI_Model_Autotuner pkg/"LLM Autotuner"/
          cp packaging/macos/*.command packaging/macos/README.txt pkg/"LLM Autotuner"/
          chmod +x pkg/"LLM Autotuner"/AI_Model_Autotuner pkg/"LLM Autotuner"/*.command
          ditto -c -k --keepParent pkg/"LLM Autotuner" "dist/${{ matrix.asset }}"

      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.MACOS_CERT_P12 != ''
        run: |
          xcrun notarytool submit "dist/${{ matrix.asset }}" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/llm-autotuner
          cp dist/AI_Model_Autotuner pkg/llm-autotuner/
          chmod +x pkg/llm-autotuner/AI_Model_Autotuner
          tar -C pkg -czf "dist/${{ matrix.asset }}" llm-autotuner

      - name: Smoke test
        shell: bash
        run: |
          exe=dist/AI_Model_Autotuner; [ "$RUNNER_OS" = "Windows" ] && exe=dist/AI_Model_Autotuner.exe
          export AUTOTUNER_HOME="$RUNNER_TEMP/autotuner-smoke"
          "$exe" --no-browser --port 8765 > smoke.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/api/health && exit 0
            sleep 1
          done
          cat smoke.log; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: LLM Autotuner ${{ github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: artifacts/*
